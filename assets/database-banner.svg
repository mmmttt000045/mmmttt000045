<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Ming Tai — Database Systems</title>
  <desc id="desc">A dark, terminal-inspired banner with a stylized database index tree.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="58%" stop-color="#111d29"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58d4ff"/>
      <stop offset="100%" stop-color="#7ee787"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#8b949e" stroke-width="0.55"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#background)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)" opacity="0.18"/>
  <rect x="70" y="56" width="5" height="188" rx="2.5" fill="url(#accent)"/>

  <text x="106" y="112" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="46" font-weight="700" letter-spacing="2">MING TAI</text>
  <text x="109" y="152" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" letter-spacing="2">DATABASE SYSTEMS · RUC · RUSHDB</text>
  <text x="109" y="207" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16">$ build --from-first-principles</text>
  <rect x="109" y="224" width="286" height="2" fill="url(#accent)" opacity="0.9"/>

  <g fill="none" stroke="#58d4ff" stroke-width="2" opacity="0.62">
    <path d="M930 91 L820 153"/>
    <path d="M930 91 L1040 153"/>
    <path d="M820 184 L752 232"/>
    <path d="M820 184 L876 232"/>
    <path d="M1040 184 L974 232"/>
    <path d="M1040 184 L1094 232"/>
  </g>
  <g stroke="#7ee787" stroke-width="2" fill="#14232a" filter="url(#glow)">
    <rect x="887" y="64" width="86" height="54" rx="8"/>
    <rect x="777" y="153" width="86" height="54" rx="8"/>
    <rect x="997" y="153" width="86" height="54" rx="8"/>
  </g>
  <g stroke="#58d4ff" stroke-width="2" fill="#14232a" opacity="0.92">
    <rect x="709" y="231" width="86" height="38" rx="7"/>
    <rect x="833" y="231" width="86" height="38" rx="7"/>
    <rect x="931" y="231" width="86" height="38" rx="7"/>
    <rect x="1051" y="231" width="86" height="38" rx="7"/>
  </g>
  <g fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" text-anchor="middle">
    <text x="930" y="97">ROOT</text>
    <text x="820" y="186">IDX-01</text>
    <text x="1040" y="186">IDX-02</text>
    <text x="752" y="255">P-01</text>
    <text x="876" y="255">P-02</text>
    <text x="974" y="255">P-03</text>
    <text x="1094" y="255">P-04</text>
  </g>
</svg>
